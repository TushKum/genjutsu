<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d4dff">
<meta name="description" content="Pehla Kadam: a learn-by-doing investing sandbox. Practice demat account with ₹1,00,000 virtual money that teaches what happens at the depository: settlement, CAS, corporate actions, pledge, nomination, e-voting and scam protection. Hindi and English.">
<title>Pehla Kadam · Investing Sandbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='22' fill='%236d4dff' stroke='%231d1147' stroke-width='6'/%3E%3Cpath d='M50 18l8 22 22 8-22 8-8 22-8-22-22-8 22-8z' fill='%239dff2f' stroke='%231d1147' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=VT323&display=swap">
<style>
:root{
  --ink:#1d1147;--ink2:#54487f;--paper:#fffaff;--bg:#e8e1ff;
  --pink:#ff3d9a;--pink2:#ffd3ea;--cyan:#14c8e6;--cyan2:#cdf7ff;--lime:#9dff2f;--lime2:#ecffd4;
  --sun:#ffd23f;--sun2:#fff3c4;--vio:#6d4dff;--vio2:#e6deff;
  --up:#067a41;--down:#c8174f;
  --title:linear-gradient(90deg,#3418c9 0%,#8f35ff 55%,#ff3d9a 100%);
  --chrome:linear-gradient(180deg,#ffffff 0%,#eeeafc 45%,#cdc6ee 52%,#f6f3ff 100%);
  --holo:linear-gradient(115deg,#ffd3ea 0%,#cdf7ff 30%,#ecffd4 55%,#fff3c4 75%,#e6deff 100%);
  --sh:4px 4px 0 var(--ink);--sh2:2px 2px 0 var(--ink);
  --px:'VT323',ui-monospace,'Baloo 2',monospace;
  --font:'Baloo 2','Noto Sans Devanagari','Nirmala UI','Mangal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.45;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(circle at 12% 8%,rgba(255,61,154,.22) 0,transparent 32%),radial-gradient(circle at 88% 28%,rgba(20,200,230,.22) 0,transparent 34%),radial-gradient(circle at 30% 90%,rgba(157,255,47,.22) 0,transparent 30%),linear-gradient(rgba(109,77,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(109,77,255,.13) 1px,transparent 1px);
  background-size:auto,auto,auto,26px 26px,26px 26px;background-attachment:fixed}
body.lock{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:.45em 0}
button{font:inherit;color:inherit}
a{color:var(--vio);font-weight:700}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative}
@media(min-width:520px){#app{border-left:3px solid var(--ink);border-right:3px solid var(--ink);background:rgba(255,250,255,.45);box-shadow:8px 0 0 rgba(29,17,71,.12)}}
main{padding:2px 12px 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
#hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#ffffff 0%,#f1ecff 100%);border-bottom:3px solid var(--ink)}
#hdrIn{padding:8px 12px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow.r2{margin-top:8px}
.logo{font-weight:800;font-size:23px;line-height:1;letter-spacing:-.3px;background:linear-gradient(180deg,#3418c9 0%,#8f35ff 48%,#ff3d9a 52%,#ff8a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(1.5px 1.5px 0 #fff) drop-shadow(1.5px 1.5px 0 rgba(29,17,71,.35));white-space:nowrap;padding-top:3px}
.spark{display:inline-block;color:var(--pink);-webkit-text-fill-color:var(--pink);margin-left:3px;font-size:18px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.simchip{font-family:var(--px);font-size:15px;line-height:1;background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:3px 5px 2px;transform:rotate(-4deg);white-space:nowrap}
.lang{margin-left:auto;display:flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:var(--sh2);background:#fff;flex-shrink:0}
.lang button{min-width:48px;min-height:44px;border:0;background:transparent;font-weight:800;cursor:pointer;padding:0 8px}
.lang button.on{background:var(--ink);color:var(--lime)}
.datechip{flex:1;min-width:0;background:var(--ink);color:#fff;border-radius:12px;padding:5px 10px;font-size:14px;line-height:1.2;border:2.5px solid var(--ink)}
.datechip b{color:var(--lime);font-family:var(--px);font-size:21px;font-weight:400;margin-right:2px}
.btn.next{min-height:48px;padding:4px 14px;flex-shrink:0}
#tick{background:var(--ink);color:var(--lime);font-family:var(--px);font-size:19px;overflow:hidden;white-space:nowrap;border-top:2px solid #000}
#tick:empty{display:none}
.tk{display:inline-flex;animation:tk 45s linear infinite;padding:3px 0}
.tk>span{padding-right:26px}
.tk i{font-style:normal;color:#fff}
.tk .u{color:var(--lime)}.tk .d{color:#ff8fc2}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
#nav:empty{display:none}
.navin{pointer-events:auto;display:flex;width:100%;max-width:464px;background:var(--holo);border:2.5px solid var(--ink);border-radius:20px;box-shadow:var(--sh);padding:4px;gap:2px}
.nb{flex:1;min-width:0;min-height:58px;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;line-height:1.1;padding:4px 2px;position:relative;text-align:center}
.nb .ic{font-size:22px;line-height:1.1}
.nb.on{background:var(--ink);color:#fff}
.nb .cnt{position:absolute;top:2px;right:8px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:11px;min-width:20px;height:20px;line-height:16px;padding:0 4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px 18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--chrome);box-shadow:var(--sh2);font-weight:700;font-size:16px;cursor:pointer;text-align:center;line-height:1.15;transition:transform .06s,box-shadow .06s;text-decoration:none;color:var(--ink)}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.nb:focus-visible,.stk:focus-visible,.tile:focus-visible,.pick:focus-visible,.lang button:focus-visible,.seg button:focus-visible,.nokia:focus-visible{outline:3px dashed var(--pink);outline-offset:3px}
.btn.pri{background:linear-gradient(180deg,#ff9ccd 0%,#ff3d9a 55%,#e0167c 100%);color:#fff;text-shadow:1px 1px 0 rgba(29,17,71,.45)}
.btn.lime{background:linear-gradient(180deg,#eaffc9 0%,#b8ff66 45%,#8ae81c 100%)}
.btn.cy{background:linear-gradient(180deg,#e2fcff 0%,#7be9fa 50%,#14c8e6 100%)}
.btn.vio{background:linear-gradient(180deg,#c3b3ff 0%,#7d5fff 50%,#5534f0 100%);color:#fff;text-shadow:1px 1px 0 rgba(29,17,71,.45)}
.btn.ghost{background:#fff}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:4px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns>.btn{flex:1 1 140px}
.link{background:none;border:0;padding:6px 0;min-height:44px;color:var(--vio);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}

/* windows */
.win{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:var(--sh);margin:16px 0;overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;background:var(--title);color:#fff;padding:7px 12px;font-weight:700;font-size:15px;border-bottom:2.5px solid var(--ink);text-shadow:1px 1px 0 rgba(0,0,0,.25);min-height:40px}
.tb .tt{flex:1;min-width:0}
.tb .spk{letter-spacing:2px;font-size:12px;opacity:.9;flex-shrink:0}
.wb{padding:14px}
.win.holo .wb{background:var(--holo)}
.win.lime .tb{background:linear-gradient(90deg,#067a41,#3fb94a 60%,#9dff2f);color:#fff}
.win.warm .tb{background:linear-gradient(90deg,#c8174f,#ff3d9a 55%,#ff8a3d)}
.win.cyan .tb{background:linear-gradient(90deg,#0b6f93,#14c8e6 60%,#7be9fa)}

/* misc */
.sub{color:var(--ink2);font-size:15px;margin:10px 2px}
.small,.note{font-size:13.5px;color:var(--ink2)}
.note{margin:10px 0 0}
.banner{margin:12px 0 4px;background:var(--sun);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:var(--sh2)}
.warn{margin:12px 0;background:var(--pink2);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.tag{display:inline-block;padding:0 8px;border:2px solid var(--ink);border-radius:999px;font-size:12.5px;font-weight:700;background:var(--sun2);line-height:20px;margin:3px 4px 0 0;white-space:nowrap}
.tag.hot{background:var(--pink);color:#fff}
.tag.ok{background:var(--lime)}
.tag.lock{background:var(--vio2)}
.px{font-family:var(--px);font-size:24px;line-height:1;font-weight:400}
.px.big{font-size:40px}
.chg{display:inline-block;font-family:var(--px);font-size:18px;line-height:20px;padding:0 6px;border-radius:6px;border:2px solid var(--ink);white-space:nowrap}
.chg.up{background:var(--lime2);color:var(--up)}.chg.dn{background:var(--pink2);color:var(--down)}
.up{color:var(--up)}.dn{color:var(--down)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;min-width:0}
.stat small{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;line-height:1.2}
.stat .px{font-size:23px;display:block;margin-top:3px;overflow-wrap:anywhere}
.stat.wide{grid-column:1/-1}
.hl{background:var(--lime2);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0}
.lt{font-size:21px;margin:2px 0 8px}
.lb h4{margin:14px 0 2px;font-size:16px;color:var(--vio)}
.lb p{margin:.5em 0}
.burst{display:inline-flex;align-items:center;justify-content:center;background:var(--sun);clip-path:polygon(50% 0%,61% 18%,82% 9%,79% 31%,100% 38%,84% 54%,96% 74%,73% 75%,68% 97%,50% 84%,32% 97%,27% 75%,4% 74%,16% 54%,0% 38%,21% 31%,18% 9%,39% 18%);font-weight:800}
.empty{text-align:center;padding:18px 8px;color:var(--ink2)}
.empty .em{font-size:40px;display:block}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.right{text-align:right}
.mt{margin-top:12px}

/* level */
.lvb{width:62px;height:62px;font-size:26px;flex-shrink:0;font-family:var(--px)}
.lvname{font-weight:800;font-size:17px;line-height:1.15}
.bar{height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,#ff7cbd 10px 20px);border-right:2px solid var(--ink)}
.xpbig{text-align:center;flex-shrink:0}
.xpbig .px{font-size:34px;display:block;color:var(--vio)}
.xpbig small{font-weight:800;font-size:12px}

/* missions */
.mi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--vio2)}
.mi:last-child{border-bottom:0}
.ck{width:28px;height:28px;border:2.5px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;font-weight:800}
.mi.done .ck{background:var(--lime)}
.mi .mn{flex:1;min-width:0;font-weight:700;line-height:1.2}
.mi.done .mn{color:var(--ink2)}
.mi .xp{font-family:var(--px);font-size:18px;color:var(--vio);flex-shrink:0}
.nextcard .wb{background:var(--holo)}
.nextcard h3{font-size:19px}

/* events */
.evr{display:flex;gap:10px;padding:10px 0;border-bottom:2px dashed var(--vio2)}
.evr:last-child{border-bottom:0}
.evd{flex-shrink:0;align-self:flex-start;width:56px;text-align:center;background:var(--ink);color:#fff;border-radius:10px;padding:4px 2px;border:2px solid var(--ink)}
.evd .px{font-size:26px;color:var(--lime);display:block}
.evd small{font-size:11px;font-weight:700;display:block;line-height:1.1}

/* market */
.stk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:var(--sh2);margin:10px 0;cursor:pointer;min-height:72px}
.stk:active{transform:translate(2px,2px);box-shadow:none}
.av{width:38px;height:38px;border-radius:12px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--px);font-size:24px;flex-shrink:0;color:var(--ink)}
.stk .nm{flex:1;min-width:0}
.stk .nm b{display:block;font-size:15.5px;line-height:1.2}
.stk .nm small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.3}
.stk .pc{text-align:right;flex-shrink:0}
.stk .pc .px{display:block;font-size:23px;margin-bottom:3px}
.spl{display:block;margin-top:3px}

/* forms */
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-weight:700;font-size:14.5px;margin-bottom:4px}
.fld small{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px}
.inp{width:100%;min-height:48px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:17px;background:#fff;color:var(--ink);box-shadow:inset 2px 2px 0 rgba(29,17,71,.12)}
select.inp{appearance:auto}
.inp:focus{outline:3px solid var(--cyan);outline-offset:1px}
.err{color:var(--down);font-weight:700;font-size:14px;margin-top:4px}
.step{display:flex;align-items:center;gap:8px}
.step .inp{text-align:center;font-family:var(--px);font-size:28px;padding:4px 6px;min-width:0;flex:1}
.step .btn.sq{width:52px;padding:0;font-size:26px;flex-shrink:0}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:999px;background:#fff;padding:3px;gap:3px;box-shadow:var(--sh2);margin:12px 0}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;font-weight:800;cursor:pointer;padding:0 6px;line-height:1.1}
.seg button.on{background:var(--title);color:#fff}
.seg .c{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:0 4px;margin-left:3px;line-height:18px}
.sumt{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
.sumt td{padding:5px 0;border-bottom:2px dotted var(--vio2)}
.sumt td:last-child{text-align:right;font-family:var(--px);font-size:21px}
.sumt tr.tot td{font-weight:800;border-bottom:0}

/* chart */
.chart{display:block;width:100%;height:auto;background:#fff;border:2.5px solid var(--ink);border-radius:12px;margin:10px 0}

/* holdings */
.hcard{background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:var(--sh2);padding:12px;margin:12px 0}
.hcard .hd{display:flex;align-items:flex-start;gap:10px}
.hcard .hd b{font-size:16px;line-height:1.2;display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kv div{background:var(--vio2);border-radius:8px;padding:5px 7px;min-width:0}
.kv small{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.15}
.kv span{font-family:var(--px);font-size:19px;display:block;line-height:1.1;overflow-wrap:anywhere}
.hcard .btns{margin-top:10px}
.prow{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;margin:10px 0}
.prow b{display:block}
.act{font-size:14px;padding:7px 0;border-bottom:1px dashed var(--vio2);display:flex;gap:8px}
.act .d{font-family:var(--px);font-size:16px;color:var(--ink2);flex-shrink:0;width:58px}

/* CAS */
.cas{background:#fffef4;border:2.5px solid var(--ink);border-radius:6px;padding:14px 12px;font-size:13.5px;box-shadow:var(--sh);background-image:repeating-linear-gradient(transparent 0 25px,rgba(109,77,255,.07) 25px 26px);margin:12px 0}
.cas h3{font-size:16px;text-align:center;letter-spacing:.3px;text-transform:uppercase}
.cas .stamp{display:block;width:max-content;margin:6px auto 10px;font-family:var(--px);font-size:16px;color:var(--down);border:2px solid var(--down);border-radius:6px;padding:0 8px;transform:rotate(-2deg)}
.cas h4{font-size:13.5px;background:var(--ink);color:#fff;padding:3px 8px;margin:14px 0 6px;border-radius:4px;letter-spacing:.3px}
.cas dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.cas dt{font-weight:700;color:var(--ink2)}
.cas dd{margin:0;overflow-wrap:anywhere}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cas table{width:100%;border-collapse:collapse;font-size:12.5px}
.cas th,.cas td{border:1px solid rgba(29,17,71,.35);padding:4px 5px;text-align:left;vertical-align:top}
.cas th{background:var(--vio2);font-size:11.5px}
.cas td.n{text-align:right;font-family:var(--px);font-size:15px;white-space:nowrap}
.cas .mono{font-family:var(--px);font-size:15px}
.cas .ft{margin-top:12px;font-size:12.5px;border-top:2px dashed var(--ink);padding-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chipb{min-height:44px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;padding:4px 14px;font-weight:700;cursor:pointer;box-shadow:var(--sh2)}
.chipb.on{background:var(--ink);color:var(--lime)}

/* desk tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:112px;padding:12px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:var(--sh);cursor:pointer}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tile .ic{font-size:30px;line-height:1.1}
.tile b{font-size:16px;line-height:1.2}
.tile small{color:var(--ink2);font-size:12.5px;font-weight:600;line-height:1.2}
.tile:nth-child(6n+1){background:linear-gradient(160deg,#fff 50%,var(--pink2))}
.tile:nth-child(6n+2){background:linear-gradient(160deg,#fff 50%,var(--cyan2))}
.tile:nth-child(6n+3){background:linear-gradient(160deg,#fff 50%,var(--lime2))}
.tile:nth-child(6n+4){background:linear-gradient(160deg,#fff 50%,var(--sun2))}
.tile:nth-child(6n+5){background:linear-gradient(160deg,#fff 50%,var(--vio2))}
.tile:nth-child(6n+6){background:linear-gradient(160deg,#fff 50%,var(--pink2))}
.backb{margin-top:12px}

/* onboarding */
.hero{text-align:center;padding:10px 4px 4px}
.hero .logo{font-size:44px;display:inline-block;margin:6px 0}
.hero .tagl{font-weight:700;font-size:18px}
.chk{list-style:none;padding:0;margin:12px 0;text-align:left}
.chk li{padding:6px 0 6px 34px;position:relative;font-weight:600}
.chk li:before{content:'✦';position:absolute;left:4px;top:3px;font-size:20px;color:var(--pink)}
.langpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:12px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:var(--sh2);cursor:pointer;min-height:60px}
.pick.on{background:var(--lime2);box-shadow:var(--sh);outline:3px solid var(--vio);outline-offset:-6px}
.pick b{font-size:17px}
.pick small{color:var(--ink2);font-size:13px;line-height:1.3}
.pick .em{font-size:26px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.dots i{width:34px;height:10px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--pink)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:8px 0}
.flow span{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14.5px;text-align:center}
.flow span:last-child{background:var(--ink);color:var(--lime)}
.flow em{font-style:normal;text-align:center;font-size:18px;line-height:1.1;color:var(--vio)}
.bocard{position:relative;overflow:hidden;background:linear-gradient(135deg,#3418c9 0%,#8f35ff 45%,#ff3d9a 100%);color:#fff;border-radius:18px;padding:16px;border:2.5px solid var(--ink);box-shadow:var(--sh);margin:12px 0}
.bocard:after{content:'';position:absolute;top:-60%;left:-30%;width:60%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(25deg)}
.bocard small{display:block;font-size:12.5px;opacity:.9;font-weight:700}
.bocard .boid{font-family:var(--px);font-size:30px;letter-spacing:1px;line-height:1.1;margin:4px 0 10px;word-spacing:6px}
.bocard .r{display:flex;gap:14px;flex-wrap:wrap}
.bocard .chipi{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#ffe58a,#d9a400);border:2px solid var(--ink);margin-bottom:8px}
.c4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.c4 div{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px;font-size:13.5px;line-height:1.35}
.c4 b{display:block;font-size:15px;margin:2px 0}
.c4 .em{font-size:24px}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(29,17,71,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--paper);border:2.5px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -4px 0 var(--ink);animation:up .22s ease-out;outline:none;overscroll-behavior:contain}
.sheet.still{animation:none}
.sheet>.tb{position:sticky;top:0;z-index:2}
.sheet .wb{padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.x{margin-left:auto;width:44px;height:44px;flex-shrink:0;border:2px solid #fff;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:22px;font-weight:800;cursor:pointer;line-height:1}
.x:focus-visible{outline:3px dashed var(--lime);outline-offset:2px}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media(min-width:560px){.ov{align-items:center;padding:20px}.sheet{border-radius:18px;border-bottom:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-height:88vh}}

/* toasts */
#toasts{position:fixed;top:8px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
.toast{pointer-events:auto;animation:drop .28s ease-out}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.nokia{display:block;width:100%;max-width:360px;background:linear-gradient(180deg,#3a3d5c,#24263b);border:2.5px solid var(--ink);border-radius:22px 22px 28px 28px;padding:9px 11px 13px;box-shadow:var(--sh);cursor:pointer;text-align:left}
.lcd{background:#b5d68a;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 2px,transparent 2px 4px);border-radius:8px;padding:7px 10px 8px;font-family:var(--px);color:#1b290c;font-size:19px;line-height:1.15;box-shadow:inset 0 0 0 2px #7f9b5a,inset 3px 3px 0 rgba(0,0,0,.08);overflow-wrap:anywhere}
.lcd .hd{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed #1b290c;margin-bottom:4px;padding-bottom:1px}
.xpt{background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:var(--sh2);max-width:360px;text-align:center}
.xpt.info{background:#fff}
.inbox .nokia{max-width:none;margin:12px 0;cursor:default}
.inbox .lcd{font-size:19px}

/* e-voting */
.vcard{background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:var(--sh2);padding:12px;margin:12px 0}
.vcard h4{font-size:16.5px;margin:8px 0 4px}
.plain{background:var(--cyan2);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin:8px 0}
.plain ol{margin:4px 0 0;padding-left:22px}
.plain li{margin:3px 0}
.vbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.vbtns .btn{padding:4px 6px;font-size:15px}
.tally{margin-top:8px}
.tally div{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin:4px 0}
.tally span.l{width:74px;flex-shrink:0}
.tally span.b{flex:1;height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.tally span.b i{display:block;height:100%}
.tally span.p{width:44px;text-align:right;font-family:var(--px);font-size:17px}

/* scam / whatsapp */
.wa{border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin:16px 0;background:#efe6ff;background-image:radial-gradient(rgba(109,77,255,.18) 1.5px,transparent 1.5px);background-size:16px 16px}
.wah{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#075e54,#128c7e 60%,#25d366);color:#fff;padding:8px 12px;border-bottom:2.5px solid var(--ink)}
.wah .av{background:#fff;font-size:20px;width:38px;height:38px;border-radius:50%}
.wah b{display:block;line-height:1.1}
.wah small{font-size:12px;opacity:.9}
.wab{padding:12px}
.bub{background:#fff;border:2px solid var(--ink);border-radius:4px 16px 16px 16px;padding:8px 12px 6px;margin:0 0 12px;max-width:92%;box-shadow:2px 2px 0 rgba(29,17,71,.25);position:relative}
.bub .fr{font-weight:800;font-size:13.5px;color:#128c7e;display:block}
.bub .tm{display:block;text-align:right;font-size:11.5px;color:var(--ink2)}
.bub.old{opacity:.8}
.bub .stampv{position:absolute;right:-6px;top:-10px;font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:0 7px;background:var(--lime);transform:rotate(6deg)}
.bub .stampv.s{background:var(--pink);color:#fff}
.fb{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px;margin:4px 0 0}
.fb.good{background:var(--lime2)}.fb.bad{background:var(--pink2)}
.fb ul{margin:6px 0;padding-left:20px}
.fb li{margin:4px 0}
.scorebig{width:140px;height:140px;margin:6px auto;font-size:40px;font-family:var(--px)}

/* certificate */
.cert{text-align:center;background:var(--holo);border:3px double var(--ink);border-radius:14px;padding:18px 12px;position:relative}
.cert .seal{width:96px;height:96px;font-size:40px;margin:0 auto 6px}
.cert h3{font-size:26px;background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent}
.cert .nm{font-size:24px;font-weight:800;border-bottom:2px dashed var(--ink);display:inline-block;padding:0 12px;margin:6px 0}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:350px){.logo{font-size:20px}.nb{font-size:11px}.simchip{display:none}}
</style>

      {f:"+91 98xxx x4x21 (unknown)",m:"🔥🔥 OPERATOR NEWS 🔥🔥 Buy CHAMAKDAR AGRO before 2 PM! GUARANTEED 300% returns in 30 days. Join our VIP group, only ₹4,999 👉 bit.ly/vip-300",w:["“Guaranteed” returns do not exist in shares. Nobody can promise 300%.","Urgency (“before 2 PM”) is used so you don't stop to think.","“Operator news” on a small unknown stock is a classic pump-and-dump: they sell to you at the top.","Paying to join a “VIP group” and short links are big red flags."]},
      {f:"Rajesh Stock Expert 😎",m:"Namaste ji 🙏 15 years experience. Not SEBI registered, but my results are better than registered advisors! Send ₹10,000 to my UPI for daily sure-shot calls.",w:["Only SEBI-registered investment advisers (INA…) and research analysts (INH…) can give paid stock advice.","He admits he is not registered. Paying him is illegal advice and you have no protection.","“Sure-shot” calls and payment to a personal UPI ID are red flags."]},
      {f:"Priya (sister) 💕",m:"Didi, I started a ₹500 monthly SIP in an index fund through my broker's app. It goes up and down, but I'm keeping it for 5+ years. Shall I show you how it works?",w:["Small amount, regular investing, a long time horizon.","No promise of returns: she even says it goes up and down.","Done in her own name through a regulated app, with no pressure and no money sent to anyone."]},
      {f:"KYC Update Team ⚠️",m:"Dear customer, your demat account will be BLOCKED today due to KYC expiry. Share the OTP you just received to update KYC, or click: kyc-demat-update.co",w:["Fear and a deadline (“blocked today”) are pressure tactics.","No genuine broker, depository or SEBI ever asks for your OTP.","Unknown links can steal your login. Update KYC only in your broker's official app or website that you open yourself."]},
      {f:"{br} ✓ (your broker)",m:"Your trade confirmation for today is in the app under Reports. Reminder: we will NEVER ask for your password, OTP or TPIN.",w:["It is information only: no link, no request for money, OTP or details.","It matches something you actually did (a trade).","Still a good habit: open the app yourself to check, instead of tapping links in messages."]}

  cert:{t:"Certificate",h:"Atmanirbhar Investor",p:"This certifies that {name} completed every Pehla Kadam mission: demat account, T+1 settlement, CAS, corporate actions, pledge, nomination, e-voting and scam protection.",sim:"Practice certificate · simulated sandbox",on:"Awarded on {date}",xp:"{n} XP earned"},
  lessons:{
    accounts:{t:"Broker, trading, demat, depository: 4 words",b:["🏪 Broker: the shop that places your orders on the stock exchange (NSE/BSE). It must be registered with SEBI.","🧾 Trading account: your order counter at the broker. You use it to BUY and SELL.","🔐 Demat account: your digital locker. Shares you own are kept here in your name, like money in a bank account.","🏛️ Depository (CDSL): the central vault that keeps the official electronic record of who owns which shares. Your broker connects you to it as a Depository Participant (DP).","## Why this matters","Your shares sit in YOUR demat account at the depository, not in the broker's pocket. The depository alerts you directly whenever they move."]},
    kyc:{t:"Why KYC?",b:["KYC means Know Your Customer. It proves you are really you, so nobody can open an account in your name.","PAN is required to invest. The 4th letter shows the holder type: “P” is for an individual person. The 5th letter is the first letter of your surname.","Aadhaar is used for quick e-KYC with an OTP. Enter that OTP only in an official app or website that you opened yourself.","KYC is recorded with a KYC Registration Agency (KRA), so your next broker can reuse it.","In this sandbox every detail is fake. Never type your real PAN or Aadhaar into a practice app."]},
    boid:{t:"Your 16-digit BO ID",b:["BO means Beneficial Owner. That's you: the real owner of the shares.","In a CDSL BO ID, the first 8 digits are your DP's ID (your broker) and the last 8 digits are your own client ID.","Your BO ID appears on every CDSL SMS, email and CAS. Think of it as your locker number."]},
    order:{t:"Order done! Now: settlement",b:["You placed a market order, so the shares were bought right away at the current price.","Your cash is already used, but the shares are PENDING. They are not in your demat yet.","## What happens overnight","The exchange's clearing corporation collects your money and the seller's shares. Then the depository moves the shares into your demat account.","Tap “Next day ⏭” to watch it happen."]},
    settle:{t:"T+1 settlement: the shares are yours!",b:["T is the trade day. T+1 is the next trading day. India settles share trades on T+1, among the fastest in the world.","Overnight the depository credited the shares to YOUR demat account, in your name.","## Why the CDSL SMS protects you","The depository messages you directly, not through your broker, every time shares come in or go out.","If you ever get a debit SMS for a sale you did not make, call your DP and the depository right away.","Make sure the mobile number and email on your demat account are your own, not an agent's."]},
    tpin:{t:"Selling needs YOUR permission",b:["Shares can leave your demat only when you allow it. Before the debit, CDSL asks for your TPIN and OTP. This is called e-DIS.","If you have signed a DDPI (Demat Debit and Pledge Instruction) with your broker, the broker can do this for sales without asking each time. Read what you sign.","Never share your TPIN or OTP with anyone, even someone who says they are from your broker or CDSL.","Your sale money also arrives on T+1."]},
    cas:{t:"CAS: one statement for everything you own",b:["CAS means Consolidated Account Statement. The depository emails it for every month in which you have a transaction, and at least once every six months otherwise.","It lists all the shares in your demat accounts, across brokers, plus your mutual fund units, all linked to your PAN.","## Check it every month","Are all holdings yours? Any sale or pledge you did not make? Is your nominee registered?","Your broker app shows what the broker tells you. The CAS shows what the depository records. If they ever differ, ask questions at once."]},
    div:{t:"Dividend: a share of the profit",b:["{co} paid a dividend of ₹{dps} per share (simulated).","{res}","## How did the company know whom to pay?","On the record date, the depository gives the company the list of owners (the “beneficiary position”). That is how money reaches the right people.","Under T+1, shares bought on the record date itself are too late: they settle the next day.","On the ex-date the price usually falls by about the dividend amount. Dividends are taxable income."]},
    bonus:{t:"Bonus issue: more shares, same value",b:["{co} gave 1 extra share for every 1 share held (1:1, simulated).","{res}","The price roughly halves, so your total value stays about the same: more slices of the same cake.","The depository credits bonus shares straight to your demat. You don't need to do anything.","Pledged shares also get the bonus, because they still belong to you."]},
    split:{t:"Stock split: same cake, smaller slices",b:["{co} split each share into 5 (simulated). The face value was divided by 5 too.","{res}","Companies split to make one share cheaper, so small investors can buy more easily.","Overnight, the depository replaced your old shares with the new ones in your demat."]},
    pledge:{t:"Pledge: shares as security",b:["Pledging lets you use shares you own as collateral to get margin (a trading limit) from your broker.","Pledged shares are LOCKED: you cannot sell them until the pledge is released. But they stay in your name, and you still get dividends, bonus and votes.","You get less than the full value. This cut is called the “haircut”.","CDSL asks for YOUR OTP before any pledge is created. No OTP, no pledge: this stops misuse.","## The risk","If prices fall, your margin shrinks. If you can't add money, the broker can “invoke” the pledge and sell your shares, even at a loss.","Most first-time investors do not need margin. Pledge only if you fully understand it."]},
    nominee:{t:"Nominee: who gets your shares",b:["A nominee is the person who will receive your shares if something happens to you.","You can add more than one nominee and choose each person's share in %.","It takes 2 minutes and can save your family months of paperwork.","You can change your nominee any time."]},
    noNom:{t:"What if there is no nominee?",b:["Your shares do not disappear. They still belong to you and, later, to your legal heirs.","But your family must go through “transmission” with heavy paperwork: death certificate, legal heir or succession certificate (or probate), affidavits and an indemnity.","This can take months and cost money, at a very hard time for the family.","With a nominee, it is usually just the death certificate and a simple form.","SEBI asks every demat holder to either add a nominee or formally opt out. You can add one any time from the Desk."]},
    evote:{t:"Your share = your vote",b:["Even 1 share makes you a part-owner. You can vote on big decisions: dividends, directors, auditors, borrowing, mergers.","One share = one vote. More shares, more votes.","You can vote online through the depository's e-voting system during the voting window. No need to travel to the AGM.","You must hold the shares on the cut-off date to vote. Once cast, a vote cannot be changed.","Small votes add up, and companies watch the results."]},
    scam:{t:"Scam Shield: the red flags",b:["🚩 Guaranteed or very high returns","🚩 Hurry: “buy before 2 PM”, “account blocked today”","🚩 Asks for OTP, TPIN, password or screen sharing","🚩 Unknown links, APK apps, payment to a personal UPI ID","🚩 “Operator”, “insider” or “sure-shot” tips, paid VIP groups","## Verify before you trust","Check the person on SEBI's website (sebi.gov.in): investment advisers' numbers start with “INA”, research analysts' with “INH”.","Report fraud on SEBI SCORES, or on cybercrime.gov.in / helpline 1930."]}
  }

  lessons:{
    accounts:{t:"ब्रोकर, ट्रेडिंग, डीमैट, डिपॉजिटरी: 4 ज़रूरी शब्द",b:["🏪 ब्रोकर: वह दुकान जो स्टॉक एक्सचेंज (NSE/BSE) पर आपके ऑर्डर लगाती है। ब्रोकर का SEBI में रजिस्टर्ड होना ज़रूरी है।","🧾 ट्रेडिंग खाता: ब्रोकर के पास आपका ऑर्डर काउंटर। इससे आप शेयर खरीदते और बेचते हैं।","🔐 डीमैट खाता: आपका डिजिटल लॉकर। आपके शेयर यहाँ आपके नाम पर रखे जाते हैं, जैसे बैंक खाते में पैसे।","🏛️ डिपॉजिटरी (CDSL): वह केंद्रीय तिजोरी जो इलेक्ट्रॉनिक रिकॉर्ड रखती है कि कौन से शेयर किसके हैं। आपका ब्रोकर डिपॉजिटरी पार्टिसिपेंट (DP) बनकर आपको इससे जोड़ता है।","## यह क्यों ज़रूरी है","आपके शेयर डिपॉजिटरी में आपके अपने डीमैट खाते में रहते हैं, ब्रोकर की जेब में नहीं। जब भी शेयर हिलते हैं, डिपॉजिटरी सीधे आपको सूचना देती है।"]},
    kyc:{t:"KYC क्यों?",b:["KYC यानी “अपने ग्राहक को जानें”। इससे साबित होता है कि आप सच में आप हैं, ताकि कोई और आपके नाम पर खाता न खोल सके।","निवेश के लिए PAN ज़रूरी है। चौथा अक्षर बताता है कि PAN किसका है: “P” मतलब एक व्यक्ति। पाँचवाँ अक्षर आपके उपनाम (सरनेम) का पहला अक्षर होता है।","आधार से OTP द्वारा जल्दी e-KYC होता है। यह OTP सिर्फ़ उसी आधिकारिक ऐप या वेबसाइट पर डालें जो आपने खुद खोली हो।","KYC एक KYC रजिस्ट्रेशन एजेंसी (KRA) में दर्ज होता है, इसलिए आपका अगला ब्रोकर इसे दोबारा इस्तेमाल कर सकता है।","इस सैंडबॉक्स में हर जानकारी नकली है। किसी प्रैक्टिस ऐप में अपना असली PAN या आधार कभी न डालें।"]},
    boid:{t:"आपकी 16 अंकों की BO ID",b:["BO यानी बेनिफ़िशियल ओनर, यानी शेयरों के असली मालिक: आप।","CDSL की BO ID में पहले 8 अंक आपके DP (ब्रोकर) की ID होते हैं और आख़िरी 8 अंक आपकी अपनी क्लाइंट ID।","आपकी BO ID हर CDSL SMS, ईमेल और CAS पर दिखती है। इसे अपने लॉकर का नंबर समझें।"]},
    order:{t:"ऑर्डर हो गया! अब: सेटलमेंट",b:["आपने मार्केट ऑर्डर दिया, इसलिए शेयर तुरंत मौजूदा भाव पर खरीदे गए।","आपका पैसा कट चुका है, लेकिन शेयर अभी “पेंडिंग” हैं। वे अभी आपके डीमैट खाते में नहीं आए हैं।","## रात में क्या होता है","एक्सचेंज का क्लियरिंग कॉर्पोरेशन आपका पैसा और बेचने वाले के शेयर इकट्ठा करता है। फिर डिपॉजिटरी शेयरों को आपके डीमैट खाते में डाल देती है।","यह होते हुए देखने के लिए “अगला दिन ⏭” दबाएँ।"]},
    settle:{t:"T+1 सेटलमेंट: शेयर अब आपके हैं!",b:["T यानी सौदे का दिन। T+1 यानी अगला कारोबारी दिन। भारत में शेयर सौदे T+1 पर सेटल होते हैं, जो दुनिया में सबसे तेज़ में से एक है।","रात में डिपॉजिटरी ने शेयर आपके अपने डीमैट खाते में, आपके नाम पर जमा कर दिए।","## CDSL का SMS आपकी रक्षा कैसे करता है","जब भी शेयर आते या जाते हैं, डिपॉजिटरी सीधे आपको संदेश भेजती है, ब्रोकर के ज़रिए नहीं।","अगर कभी ऐसी बिक्री का डेबिट SMS आए जो आपने नहीं की, तो तुरंत अपने DP और डिपॉजिटरी को फ़ोन करें।","पक्का करें कि डीमैट खाते में मोबाइल नंबर और ईमेल आपके अपने हों, किसी एजेंट के नहीं।"]},
    tpin:{t:"बेचने के लिए आपकी अनुमति ज़रूरी है",b:["शेयर आपके डीमैट से तभी निकल सकते हैं जब आप अनुमति दें। डेबिट से पहले CDSL आपका TPIN और OTP माँगता है। इसे e-DIS कहते हैं।","अगर आपने ब्रोकर के साथ DDPI (डीमैट डेबिट और प्लेज निर्देश) पर साइन किया है, तो ब्रोकर बिक्री के लिए हर बार पूछे बिना यह कर सकता है। साइन करने से पहले पढ़ें।","अपना TPIN या OTP किसी को न बताएँ, उसे भी नहीं जो खुद को ब्रोकर या CDSL से बताए।","बिक्री का पैसा भी T+1 पर आता है।"]},
    cas:{t:"CAS: आपकी हर चीज़ का एक स्टेटमेंट",b:["CAS यानी कंसोलिडेटेड अकाउंट स्टेटमेंट। जिस महीने आपका कोई लेन-देन हो, डिपॉजिटरी इसे ईमेल से भेजती है, वरना कम से कम हर छह महीने में एक बार।","इसमें आपके PAN से जुड़े सभी डीमैट खातों के शेयर, अलग-अलग ब्रोकरों के भी, और आपके म्यूचुअल फ़ंड यूनिट दिखते हैं।","## हर महीने जाँचें","क्या सारी होल्डिंग्स आपकी हैं? कोई बिक्री या गिरवी जो आपने नहीं की? क्या आपका नॉमिनी दर्ज है?","ब्रोकर ऐप वह दिखाता है जो ब्रोकर बताता है। CAS वह दिखाता है जो डिपॉजिटरी के रिकॉर्ड में है। अगर दोनों में फ़र्क हो, तो तुरंत सवाल पूछें।"]},
    div:{t:"डिविडेंड: मुनाफ़े में हिस्सा",b:["{co} ने ₹{dps} प्रति शेयर डिविडेंड दिया (सिम्युलेटेड)।","{res}","## कंपनी को कैसे पता चला कि किसे पैसा देना है?","रिकॉर्ड डेट पर डिपॉजिटरी कंपनी को मालिकों की सूची (“बेनिफ़िशियरी पोज़िशन”) देती है। इसी से पैसा सही लोगों तक पहुँचता है।","T+1 में रिकॉर्ड डेट के दिन ही खरीदे गए शेयर देर से हैं: वे अगले दिन सेटल होते हैं।","एक्स-डेट पर भाव आमतौर पर लगभग डिविडेंड जितना गिरता है। डिविडेंड पर टैक्स लगता है।"]},
    bonus:{t:"बोनस इश्यू: शेयर ज़्यादा, कीमत वही",b:["{co} ने हर 1 शेयर पर 1 अतिरिक्त शेयर दिया (1:1, सिम्युलेटेड)।","{res}","भाव लगभग आधा हो जाता है, इसलिए कुल कीमत लगभग वही रहती है: उसी केक के ज़्यादा टुकड़े।","डिपॉजिटरी बोनस शेयर सीधे आपके डीमैट में डालती है। आपको कुछ नहीं करना पड़ता।","गिरवी रखे शेयरों पर भी बोनस मिलता है, क्योंकि वे अब भी आपके ही हैं।"]},
    split:{t:"स्टॉक स्प्लिट: वही केक, छोटे टुकड़े",b:["{co} ने हर शेयर को 5 में बाँटा (सिम्युलेटेड)। फ़ेस वैल्यू भी 5 से भाग हुई।","{res}","कंपनियाँ स्प्लिट इसलिए करती हैं ताकि एक शेयर सस्ता हो और छोटे निवेशक आसानी से खरीद सकें।","रात में डिपॉजिटरी ने आपके डीमैट में पुराने शेयरों को नए शेयरों से बदल दिया।"]},
    pledge:{t:"प्लेज (गिरवी): शेयरों को ज़मानत बनाना",b:["प्लेज से आप अपने शेयरों को ज़मानत (कोलैटरल) बनाकर ब्रोकर से मार्जिन (ट्रेडिंग लिमिट) ले सकते हैं।","गिरवी रखे शेयर लॉक हो जाते हैं: गिरवी छूटने तक आप उन्हें बेच नहीं सकते। लेकिन वे आपके नाम पर ही रहते हैं, और डिविडेंड, बोनस और वोट आपको ही मिलते हैं।","आपको पूरी कीमत नहीं मिलती। इस कटौती को “हेयरकट” कहते हैं।","कोई भी प्लेज बनने से पहले CDSL आपका OTP माँगता है। OTP नहीं, तो प्लेज नहीं: इससे दुरुपयोग रुकता है।","## जोखिम","अगर भाव गिरे, तो आपका मार्जिन घटता है। अगर आप पैसा नहीं डाल पाए, तो ब्रोकर प्लेज “इनवोक” करके आपके शेयर बेच सकता है, नुकसान में भी।","ज़्यादातर नए निवेशकों को मार्जिन की ज़रूरत नहीं होती। पूरी तरह समझकर ही प्लेज करें।"]},
    nominee:{t:"नॉमिनी: आपके शेयर किसे मिलेंगे",b:["नॉमिनी वह व्यक्ति है जिसे आपके साथ कुछ होने पर आपके शेयर मिलेंगे।","आप एक से ज़्यादा नॉमिनी जोड़ सकते हैं और हर व्यक्ति का हिस्सा % में तय कर सकते हैं।","इसमें 2 मिनट लगते हैं और यह आपके परिवार को महीनों की कागज़ी कार्रवाई से बचा सकता है।","आप जब चाहें नॉमिनी बदल सकते हैं।"]},
    noNom:{t:"अगर कोई नॉमिनी न हो तो?",b:["आपके शेयर गायब नहीं होते। वे आपके ही रहते हैं, और बाद में आपके कानूनी वारिसों के।","लेकिन परिवार को भारी कागज़ी कार्रवाई के साथ “ट्रांसमिशन” करवाना पड़ता है: मृत्यु प्रमाणपत्र, उत्तराधिकार या कानूनी वारिस प्रमाणपत्र (या प्रोबेट), हलफ़नामे और क्षतिपूर्ति पत्र।","इसमें महीनों लग सकते हैं और पैसा भी, वो भी परिवार के सबसे मुश्किल समय में।","नॉमिनी होने पर आमतौर पर सिर्फ़ मृत्यु प्रमाणपत्र और एक आसान फ़ॉर्म लगता है।","SEBI हर डीमैट खाताधारक से कहता है कि या तो नॉमिनी जोड़ें या औपचारिक रूप से ऑप्ट-आउट करें। आप डेस्क से कभी भी नॉमिनी जोड़ सकते हैं।"]},
    evote:{t:"आपका शेयर = आपका वोट",b:["1 शेयर से भी आप कंपनी के हिस्सेदार बन जाते हैं। आप बड़े फ़ैसलों पर वोट कर सकते हैं: डिविडेंड, निदेशक, ऑडिटर, कर्ज़, विलय।","एक शेयर = एक वोट। ज़्यादा शेयर, ज़्यादा वोट।","वोटिंग के समय में आप डिपॉजिटरी के ई-वोटिंग सिस्टम से ऑनलाइन वोट कर सकते हैं। AGM तक जाने की ज़रूरत नहीं।","वोट करने के लिए कट-ऑफ़ डेट पर शेयर आपके पास होने चाहिए। एक बार डाला गया वोट बदला नहीं जा सकता।","छोटे-छोटे वोट मिलकर बड़े होते हैं, और कंपनियाँ नतीजों पर नज़र रखती हैं।"]},
    scam:{t:"स्कैम शील्ड: खतरे के निशान",b:["🚩 गारंटीड या बहुत ज़्यादा रिटर्न का वादा","🚩 जल्दबाज़ी: “2 बजे से पहले खरीदें”, “आज खाता ब्लॉक हो जाएगा”","🚩 OTP, TPIN, पासवर्ड या स्क्रीन शेयर माँगना","🚩 अनजान लिंक, APK ऐप, किसी के निजी UPI ID पर पैसा","🚩 “ऑपरेटर”, “अंदर की खबर” या “पक्के” टिप, पैसे वाले VIP ग्रुप","## भरोसा करने से पहले जाँचें","SEBI की वेबसाइट (sebi.gov.in) पर व्यक्ति को जाँचें: इन्वेस्टमेंट एडवाइज़र का नंबर “INA” से और रिसर्च एनालिस्ट का “INH” से शुरू होता है।","धोखे की शिकायत SEBI SCORES पर, या cybercrime.gov.in / हेल्पलाइन 1930 पर करें।"]}
  }
}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const PX={};
STOCKS.forEach(st=>{
  const r=rng(hash(st.s)^20260601);let p=st.p0;const a=[];
  for(let i=0;i<NDAYS;i++){
    if(i>0){const u=Math.max(1e-9,r()),v=r();const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);p=p*Math.exp(st.dr+st.vol*z)}
    a.push(p);
  }
  EVENTS.filter(e=>e.s===st.s).forEach(e=>{for(let i=e.i;i<NDAYS;i++){if(e.k==='div')a[i]-=e.dps;else if(e.k==='bonus')a[i]/=(1+e.r);else a[i]/=e.r}});
  PX[st.s]=a.map(x=>Math.round(x*20)/20); // NSE tick size ₹0.05
});

/* ---------- 4. Helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function get(o,k){return k.split('.').reduce((a,x)=>a!=null&&a[x]!=null?a[x]:undefined,o)}
function fill(s,p){return p?String(s).replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m):s}
function t(k,p){let v=get(T[state.lang],k);if(v==null)v=get(T.en,k);if(v==null)return k;return typeof v==='string'?fill(v,p):v}
function r2(n){return Math.round(n*100)/100}
function inr(n,d){d=d==null?2:d;const v=Number(n)||0;try{return(v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})}catch(e){return(v<0?'−':'')+'₹'+Math.abs(v).toFixed(d)}}
function loc(){return state.lang==='hi'?'hi-IN':'en-IN'}
function fdate(i,o){const d=DATES[Math.max(0,Math.min(LAST,i))];try{return d.toLocaleDateString(loc(),o||{day:'numeric',month:'short',year:'numeric'})}catch(e){return d.toDateString()}}
function fshort(i){return fdate(i,{day:'numeric',month:'short'})}
function mkey(i){const d=DATES[i];return d.getFullYear()+'-'+d.getMonth()}
function fmonth(k){const a=k.split('-');const d=new Date(+a[0],+a[1],1);try{return d.toLocaleDateString(loc(),{month:'long',year:'numeric'})}catch(e){return k}}
function co(s){return SK[s]?(SK[s].n[state.lang]||SK[s].n.en):s}
function P(s,i){return PX[s][i==null?state.day:i]}
function chgPct(s){const p=P(s),q=P(s,Math.max(0,state.day-1));return(p-q)/q*100}
function maskBo(){return'****'+String(state.bo).slice(-4)}
function brName(){const b=BROKERS.find(b=>b.id===state.broker);return b?b.n:''}
function boFmt(b){return String(b).replace(/(\d{4})(?=\d)/g,'$1 ')}
function pendQ(s){return state.pend.filter(o=>o.s===s).reduce((a,o)=>a+o.q,0)}
function freeQ(s){const h=state.hold[s];return h?h.q-h.pl:0}
function pf(){let val=0,inv=0,mar=0,pq=0;for(const s in state.hold){const h=state.hold[s];val+=h.q*P(s);inv+=h.q*h.avg;mar+=h.pl*P(s)*(1-SK[s].hc/100);pq+=h.pl}let pv=0;state.pend.forEach(o=>pv+=o.q*o.p);let pc=0;state.pcash.forEach(o=>pc+=o.a);return{val,inv,mar,pv,pc,pq,total:state.cash+val+pv+pc}}
function allDone(){return MIS.every(m=>state.m[m[0]]!=null)}
function level(){if(allDone())return 3;return state.xp>=LV[2]?2:state.xp>=LV[1]?1:0}
function win(title,body,cls){return`<section class="win ${cls||''}"><div class="tb"><span class="tt">${title}</span><span class="spk" aria-hidden="true">✦✧✦</span></div><div class="wb">${body}</div></section>`}

const toasts=[];
function toast(fn,cls,onclick,ms){
  const box=$('#toasts');const el=document.createElement(onclick?'button':'div');el.className='toast '+cls;
  const o={el,fn};o.rm=()=>{el.remove();const k=toasts.indexOf(o);if(k>=0)toasts.splice(k,1)};
  if(onclick){el.type='button';el.onclick=()=>{o.rm();onclick()}}
  el.innerHTML=fn();toasts.push(o);box.appendChild(el);
  while(toasts.length>3)toasts[0].rm();
  setTimeout(o.rm,ms||5200);
}

function go(tab,sub){ui.tab=tab;ui.sub=sub||null;if(sub==='inbox')state.sms.forEach(m=>m.r=true);if(sub==='nominee')ui.nomForm=null;save();render();window.scrollTo(0,0)}
function openModal(m,front){if(m.k==='lesson')state.seen[m.id]=1;if(m.k==='corp')state.seen[EVENTS[m.e].k]=1;front?ui.modals.unshift(m):ui.modals.push(m);save();renderModal()}
function closeModal(){ui.modals.shift();renderModal()}

function snapHold(){const o={};for(const s in state.hold){o[s]={q:state.hold[s].q,pl:state.hold[s].pl}}return o}
function advance(){
  if(state.day>=LAST){info(()=>t('lastDayToast'));return}
  const mPrev=mkey(state.day),snapPrev=snapHold();
  state.day++;
  if(mkey(state.day)!==mPrev){state.snap[mPrev]=snapPrev;sms('cas',{m:mPrev})}
  let settled=0;
  state.pend=state.pend.filter(o=>{
    if(o.st>state.day)return true;
    const h=state.hold[o.s]||(state.hold[o.s]={q:0,pl:0,avg:0});
    h.avg=(h.avg*h.q+o.p*o.q)/(h.q+o.q);h.q+=o.q;
    addTx('cr',{s:o.s,q:o.q,w:'buy'});sms('cr',{s:o.s,q:o.q});settled++;return false;
  });
  state.pcash=state.pcash.filter(o=>{if(o.st>state.day)return true;state.cash=r2(state.cash+o.a);addTx('fund',{s:o.s,a:o.a});return false});
  info(()=>t('dayToast',{date:fdate(state.day)}));
  const firstSettle=settled>0&&state.m.settle==null;
  if(firstSettle){openModal({k:'lesson',id:'settle'});if(state.nom.st==='none')openModal({k:'nomPrompt'})}
  const evs=EVENTS.filter(e=>e.i===state.day);
  evs.forEach(e=>openModal({k:'corp',e:EVENTS.indexOf(e),res:applyEvent(e)}));
  if(firstSettle)complete('settle');
  if(evs.length)complete('corp');
  save();render();
}
function applyEvent(e){
  const h=state.hold[e.s];const res={held:!!(h&&h.q>0),p0:P(e.s,e.i-1),p1:P(e.s,e.i)};
  if(!res.held)return res;
  if(e.k==='div'){res.q=h.q;res.amt=r2(h.q*e.dps);state.cash=r2(state.cash+res.amt);addTx('div',{s:e.s,q:h.q,a:res.amt});sms('div',{s:e.s,a:res.amt},'BANK')}
  else if(e.k==='bonus'){res.q0=h.q;const add=h.q*e.r;h.q+=add;h.avg=h.avg/(1+e.r);res.q1=h.q;addTx('cr',{s:e.s,q:add,w:'bonus'});sms('bonus',{s:e.s,q:add})}
  else{res.q0=h.q;const add=h.q*(e.r-1);h.q*=e.r;h.pl*=e.r;h.avg=h.avg/e.r;res.q1=h.q;addTx('cr',{s:e.s,q:add,w:'split'});sms('split',{s:e.s,q:h.q})}
  if(res.q0!=null){res.v0=res.q0*res.p0;res.v1=res.q1*res.p1}
  return res;
}
function ordCalc(m){
  const p=P(m.s),q=m.q;let err='';
  if(state.day>=LAST)err=t('st.lastDay');
  else if(!(q>=1)||Math.floor(q)!==q)err=t('err.qty');
  else if(m.side==='buy'&&q*p>state.cash+1e-6)err=t('err.cash');
  else if(m.side==='sell'&&q>freeQ(m.s))err=t('err.free',{n:freeQ(m.s)});
  return{p,q,amt:(q>0?q:0)*p,err};
}
function doBuy(s,q){
  const c=ordCalc({s,q,side:'buy'});if(c.err)return;
  state.cash=r2(state.cash-c.amt);state.pend.push({s,q,p:c.p,d:state.day,st:state.day+1});
  addTx('buy',{s,q,p:c.p,a:r2(c.amt)});
  dropModals(['stock']);
  toast(()=>t('st.bought',{q,s:co(s)}),'xpt info');
  const first=state.m.buy==null;if(first)openModal({k:'lesson',id:'order'});
  complete('buy');save();render();
}
function doSell(s,q){
  const c=ordCalc({s,q,side:'sell'});if(c.err)return;
  const h=state.hold[s];const real=r2((c.p-h.avg)*q);
  h.q-=q;if(h.q<=0)delete state.hold[s];
  state.pcash.push({s,q,a:r2(c.amt),st:state.day+1});
  addTx('sell',{s,q,p:c.p,a:r2(c.amt),r:real});addTx('dr',{s,q,w:'sell'});sms('dr',{s,q});
  dropModals(['otp','stock']);
  toast(()=>t('st.sold',{q,s:co(s),r:real>=0?t('st.profit',{a:inr(real)}):t('st.loss',{a:inr(-real)})}),'xpt info');
  if(state.m.sell==null)openModal({k:'lesson',id:'tpin'});
  complete('sell');save();render();
}
function doPledge(s,q){
  const h=state.hold[s];if(!h||q<1||q>h.q-h.pl)return;
  h.pl+=q;addTx('pl',{s,q});sms('pl',{s,q});
  dropModals(['otp','pledge']);
  toast(()=>t('pl.done',{q,s:co(s)}),'xpt info');
  if(state.m.pledge==null)openModal({k:'lesson',id:'pledge'});
  complete('pledge');save();render();
}
function unpledge(s){const h=state.hold[s];if(!h||!h.pl)return;const q=h.pl;h.pl=0;addTx('upl',{s,q});sms('upl',{s,q});toast(()=>t('pl.released',{q,s:co(s)}),'xpt info');save();render()}

  const same=m===lastM,old=box.querySelector('.sheet'),st=same&&old?old.scrollTop:0;
  box.innerHTML=`<div class="ov" data-a="ovl"><div class="sheet ${same?'still':''}" role="dialog" aria-modal="true" tabindex="-1">${MB[m.k](m)}</div></div>`;
  const sh=box.querySelector('.sheet');sh.scrollTop=st;if(!same)sh.focus({preventScroll:true});
  lastM=m;document.body.classList.add('lock');
}

/* ---------- 12. Event wiring ---------- */
const A={
  lang:d=>{state.lang=d.l;save();toasts.forEach(o=>o.el.innerHTML=o.fn());tickKey='';render()},
  tab:d=>{dropModals(['stock','lesson']);go(d.t)},
  sub:d=>go('desk',d.s),
  back:()=>{ui.sub=null;ui.nomForm=null;ui.nomErr='';render();window.scrollTo(0,0)},
  next:()=>advance(),
  close:()=>closeModal(),
  ovl:(d,el,ev)=>{if(ev.target===el&&ui.modals[0]&&ui.modals[0].k!=='otp')closeModal()},
  lesson:d=>openModal({k:'lesson',id:d.id},true),
  cert:()=>openModal({k:'cert'},true),
  mgo:d=>{const id=d.m;const G={buy:()=>go('market'),settle:()=>state.pend.length?advance():go('market'),nominee:()=>go('desk','nominee'),cas:()=>{ui.seg='cas';go('demat');viewCas()},sell:()=>{ui.seg='hold';go('demat')},corp:()=>advance(),pledge:()=>go('desk','pledge'),vote:()=>go('desk','evote'),scam:()=>go('shield')};(G[id]||(()=>go('home')))()},
  // onboarding
  obGo:d=>{state.ob=+d.n;save();render();window.scrollTo(0,0)},
  obSample:()=>{ui.ob.f={name:state.lang==='hi'?'आशा वर्मा':'Asha Verma',pan:'ABCPV1234K',aad:'9876 5432 1098',mob:'9876543210',dob:'1995-08-15'};ui.ob.e={};render()},
  obVerify:()=>{const e=validateKyc();ui.ob.e=e;if(Object.keys(e).length){render();const f=$('.err');if(f)f.scrollIntoView({block:'center'});return}
    const f=ui.ob.f;state.kyc={name:f.name.trim(),pan:f.pan.trim(),aad:f.aad.replace(/\s/g,''),mob:f.mob.trim(),dob:f.dob};state.ob=2;toast(()=>t('ob.kycOk'),'xpt info');save();render();window.scrollTo(0,0)},
  pickBroker:d=>{state.broker=d.b;save();render()},
  obBroker:()=>{if(!state.broker)return;const b=BROKERS.find(x=>x.id===state.broker);let c='';for(let i=0;i<8;i++)c+=Math.floor(Math.random()*10);state.bo=b.dp+c;state.ob=3;save();render();window.scrollTo(0,0)},
  obEnter:()=>{state.onb=true;ui.tab='home';sms('welcome');complete('open');save();render();window.scrollTo(0,0)},
  // market
  stock:d=>{dropModals(['stock']);const side=d.side||'buy';openModal({k:'stock',s:d.s,side,q:1},true)},
  side:d=>{const m=ui.modals[0];m.side=d.v;m.q=1;renderModal()},
  qty:d=>{const m=ui.modals[0];m.q=Math.max(1,(parseInt(m.q,10)||0)+(+d.n));renderModal()},
  qmax:()=>{const m=ui.modals[0];m.q=Math.max(1,m.side==='buy'?Math.floor(state.cash/P(m.s)):freeQ(m.s));renderModal()},
  order:()=>{const m=ui.modals[0];const c=ordCalc(m);if(c.err)return;if(m.side==='buy')doBuy(m.s,m.q);else startOtp('sell',{s:m.s,q:m.q})},
  otpFill:()=>{const m=ui.modals[0];m.val=m.code;m.err='';renderModal()},
  otpOk:()=>{const m=ui.modals[0];if(String(m.val).trim()!==m.code){m.err=t('err.otp');renderModal();return}if(m.pu==='sell')doSell(m.s,m.q);else doPledge(m.s,m.q)},
  seg:d=>{ui.seg=d.s;render();if(d.s==='cas')viewCas()},
  casM:d=>{ui.casM=d.m;render()},
  // pledge
  plOpen:d=>openModal({k:'pledge',s:d.s,q:freeQ(d.s)},true),
  pq:d=>{const m=ui.modals[0];m.q=Math.max(1,Math.min(freeQ(m.s),(parseInt(m.q,10)||0)+(+d.n)));renderModal()},
  pqmax:()=>{const m=ui.modals[0];m.q=freeQ(m.s);renderModal()},
  plReq:()=>{const m=ui.modals[0];if(!(m.q>=1&&m.q<=freeQ(m.s)))return;startOtp('pledge',{s:m.s,q:m.q})},
  unpl:d=>unpledge(d.s),
  // nominee
  nomAdd:()=>{ui.nomForm.push({n:'',r:'daughter',p:0});ui.nomErr='';render()},
  nomDel:d=>{ui.nomForm.splice(+d.i,1);ui.nomErr='';render()},
  nomEdit:()=>{ui.nomForm=state.nom.list.map(x=>Object.assign({},x));render()},
  nomCancel:()=>{ui.nomForm=null;ui.nomErr='';render()},
  nomSave:()=>{const fm=ui.nomForm;if(fm.some(x=>String(x.n).trim().length<2)){ui.nomErr=t('err.nomName');render();return}
    if(nomTotal()!==100||fm.some(x=>!(parseInt(x.p,10)>0))){ui.nomErr=t('err.nomPct');render();return}
    state.nom={st:'added',list:fm.map(x=>({n:String(x.n).trim(),r:x.r,p:parseInt(x.p,10)}))};ui.nomForm=null;ui.nomErr='';
    addTx('nom');sms('nom');toast(()=>t('nm.saved'),'xpt info');if(state.m.nominee==null)openModal({k:'lesson',id:'nominee'});complete('nominee');save();render()},
  nomSkip:()=>{if(state.nom.st!=='added')state.nom.st='skipped';ui.nomForm=null;ui.nomErr='';openModal({k:'lesson',id:'noNom'},true);save();render()},
  npAdd:()=>{closeModal();go('desk','nominee')},
  npSkip:()=>{closeModal();if(state.nom.st!=='added')state.nom.st='skipped';openModal({k:'lesson',id:'noNom'},true);save();render()},
  // voting
  vote:d=>openModal({k:'vote',s:d.s,c:d.c},true),
  voteOk:()=>{const m=ui.modals[0];const h=state.hold[m.s];if(!h||state.votes[m.s])return closeModal();
    state.votes[m.s]={c:m.c,q:h.q,d:state.day};addTx('vote',{s:m.s,c:m.c});dropModals(['vote']);toast(()=>t('vt.toast'),'xpt info');
    if(state.m.vote==null)openModal({k:'lesson',id:'evote'});complete('vote');save();render()},
  // scam
  scamAns:d=>{if(state.scam.ans.length>=5)return;state.scam.ans.push(d.v);ui.scamFb=true;save();render();const fb=$('.fb');if(fb)fb.scrollIntoView({block:'center'})},
  scamNext:()=>{ui.scamFb=false;const sc=state.scam;
    if(sc.ans.length>=5){const score=sc.ans.filter((a,i)=>a===SCAM_ANS[i]).length;
      if(!sc.done){sc.done=true;sc.score=score;openModal({k:'lesson',id:'scam'});if(score){state.xp+=score*5;toast(()=>t('xpToast',{n:score*5,m:t('sc.bonus')}),'xpt')}complete('scam')}
      else sc.score=Math.max(sc.score,score)}
    save();render();window.scrollTo(0,0)},
  scamAgain:()=>{state.scam.ans=[];ui.scamFb=false;save();render();window.scrollTo(0,0)},
  // reset
  reset:()=>openModal({k:'reset'},true),
  resetOk:()=>{const lang=state.lang;try{localStorage.removeItem(KEY)}catch(e){}state=fresh(lang);ui.tab='home';ui.sub=null;ui.seg='hold';ui.casM=null;ui.modals=[];ui.nomForm=null;ui.nomErr='';ui.scamFb=false;ui.ob={f:{name:'',pan:'',aad:'',mob:'',dob:''},e:{}};toasts.slice().forEach(o=>o.rm());tickKey='';save();render();window.scrollTo(0,0)}
};
const IN={
  obf:el=>{let v=el.value;if(el.dataset.f==='pan'){v=v.toUpperCase();if(v!==el.value)el.value=v}ui.ob.f[el.dataset.f]=v},
  qty:el=>{const m=ui.modals[0];if(!m)return;m.q=parseInt(el.value,10)||0;const c=ordCalc(m);$('#ordSum').innerHTML=ordSum(m,c);$('#ordBtn').disabled=!!c.err},
  pq:el=>{const m=ui.modals[0];if(!m)return;m.q=parseInt(el.value,10)||0;$('#plSum').innerHTML=plSum(m);$('#plBtn').disabled=!(m.q>=1&&m.q<=freeQ(m.s))},
  otp:el=>{const m=ui.modals[0];if(m)m.val=el.value.replace(/\D/g,'')},
  nom:el=>{const x=ui.nomForm[+el.dataset.i];if(!x)return;x[el.dataset.f]=el.value;if(el.dataset.f==='p'){const n=$('#nomTot');if(n)n.innerHTML='<b>'+t('nm.total',{n:nomTotal()})+'</b>'}},
  drop:el=>{ui.drop=+el.value;$('#dropL').textContent=t('pl.drop',{d:ui.drop});$('#riskOut').innerHTML=riskOut()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;const fn=A[el.dataset.a];if(fn){fn(el.dataset,el,ev)}});
document.addEventListener('input',ev=>{const el=ev.target;const k=el.dataset&&el.dataset.in;if(k&&IN[k])IN[k](el)});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.modals.length){closeModal();return}
  if(ev.key==='Enter'&&ev.target.dataset){const k=ev.target.dataset.in;if(k==='otp')A.otpOk();else if(k==='qty'&&!$('#ordBtn').disabled)A.order()}
});

render();
</script>
